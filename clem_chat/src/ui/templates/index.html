  <script src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">⬡ Clementine Coder</div>
      <div class="brand-sub">Local AI · MLX · Apple Silicon</div>
    </div>

    <div class="model-status">
      <div class="status-dot loading" id="status-dot"></div>
      <div>
        <div class="status-label" id="status-label">Initializing…</div>
        <div class="status-model" id="status-model"></div>
      </div>
    </div>

    <button class="btn-new-chat" onclick="newChat()">
      <span>＋</span> New chat
    </button>

    <div class="model-list" id="model-list">

    <div class="sidebar-footer">
      mlx-lm · Running locally
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <span class="topbar-model-badge" id="topbar-model">—</span>
        <span id="topbar-status" style="color:var(--text-muted);font-size:11px;">Loading model…</span>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">{ }</div>
        <div class="empty-title">Ask me to write code</div>
        <div class="empty-sub">I generate code in any language</div>
        <div class="quick-prompts">
          <button class="quick-prompt" onclick="usePrompt('Write a REST API in Python using FastAPI with CRUD operations for a todo list')">
            <strong>Python API</strong>FastAPI REST + CRUD example
          </button>
          <button class="quick-prompt" onclick="usePrompt('Write a Kotlin data class for a User with serialization and validation')">
            <strong>Kotlin</strong>Data class + serialization
          </button>
          <button class="quick-prompt" onclick="usePrompt('Write an HTML page with a dark-themed landing page and CSS animations')">
            <strong>HTML/CSS</strong>Dark landing page
          </button>
          <button class="quick-prompt" onclick="usePrompt('Write a Swift struct for networking with async/await URLSession')">
            <strong>Swift</strong>Async networking struct
          </button>
          <button class="quick-prompt" onclick="usePrompt('create me a pong game using html, add start button, ai opponent, wasd and arrow key controls, score board, win message when score reaches 5')">
            <strong>Create Pong Game</strong>Pong game (1972) Vibed
          </button>
          <button class="quick-prompt" onclick="usePrompt('create me a snake game in html, add start button, if the user loose, add dialog then reset button, let scores be tracked then let high score save locally, beautify the UI as much as possible')">
            <strong>Create Snake Game</strong>Snake  game (1976) Vibed
          </button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Ask for code in any language…" rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn-send" id="send-btn" onclick="sendMessage()">↑</button>
      </div>
      <div class="input-hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<div class="download-toast" id="toast"></div>
</body>
</html>
